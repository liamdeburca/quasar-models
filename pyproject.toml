[build-system]
requires = [
    "wheel", 
    "setuptools==72.1.0",
    "Cython==3.0.12", 
    "numpy==1.26",
]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-models"
authors = [{name = "Liam", email = "liam_deburca@me.com"}]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "quasar-typing==0.1.0",
    "quasar-utils==0.1.0",

    "matplotlib==3.10.0",
    "pydantic==2.12",
    "astropy==7.0",
    "numpy==1.26",
    "scipy==1.16",
    "click==8.5.0",
    "emcee==3.1.6",
    "lazy-imports==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "isort==9.0.2",
]

[project.urls]
Repository = "https://github.com/liamdeburca/quasar-models"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quasar_models = ["**/.data/*"]

[tool.ruff]
line-length = 79

[lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
markers = [
    "benchmark: test benchmarks different methods",
]